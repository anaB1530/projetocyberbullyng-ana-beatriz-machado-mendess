<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conscientização e Combate ao Cyberbullying - Ambiente Escolar</title>
    <style>
        /* CSS: Design em Tons de Roxo e Recursos de Acessibilidade */
        :root {
            --bg-color: #f5f0f8;
            --text-color: #2a1b3d;
            --primary-purple: #4a154b;
            --secondary-purple: #6a2c70;
            --accent-purple: #9d4edf;
            --light-purple: #ede7f6;
            --card-bg: #ffffff;
            --border-color: #d1c4e9;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 100%;
            line-height: 1.6;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
        }

        /* Barra de Acessibilidade */
        .accessibility-bar {
            background-color: var(--primary-purple);
            color: #ffffff;
            padding: 0.6rem 1rem;
            text-align: right;
            border-bottom: 2px solid var(--accent-purple);
        }

        .accessibility-bar span {
            margin-right: 0.5rem;
            font-weight: bold;
        }

        .accessibility-bar button {
            background-color: var(--secondary-purple);
            color: #ffffff;
            border: 1px solid #ffffff;
            padding: 0.4rem 0.8rem;
            margin-left: 0.3rem;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.9
